<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song Card Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; }
    input { width: 70%; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    textarea { width: 100%; height: 160px; margin-top: 15px; font-family: monospace; }
  </style>
</head>
<!-- TODO update to copy generated text when pressing enter and format so it pastes with proper indentation in html -->
<body>
  <h2>Song Card Generator</h2>
  <input id="query" placeholder="e.g. fromis_9 supersonic or track ID" />
  <button onclick="generateCard()">Generate</button>
  <textarea id="output" placeholder="Your ready-to-paste HTML will appear here..."></textarea>

  <script>
    async function generateCard() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;

      // Detect if user pasted an ID/number or a search query
      const isId = /^\d+$/.test(q);
      const url = isId 
        ? `https://itunes.apple.com/lookup?id=${q}` 
        : `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=1`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const song = data.results[0];

        if (!song) {
          alert('No song found!');
          return;
        }

        const highResArt = song.artworkUrl100.replace('100x100bb', '600x600bb');

        // Formats the exact button block
        const snippet = 
`<button class="song-card" data-preview="${song.previewUrl}">
  <img src="${highResArt}" alt="album art" class="song-cover">
  <div class="song-info">
    <span class="song-title">${song.trackName}</span>
    <span class="song-artist">${song.artistName}</span>
  </div>
  <span class="play-indicator">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </span>
</button>`;

        document.getElementById('output').value = snippet;
        document.getElementById('output').select();
      } catch (err) {
        alert('Fetch failed. You can run this file via Live Server to avoid local file restrictions.');
      }
    }
  </script>
</body>
</html>
