<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song Card Generator</title>
  <style>
    body { max-width: 650px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
    input { width: 70%; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    textarea { width: 100%; height: 190px; margin-top: 15px; font-family: monospace; }
    .status { margin-top: 8px; font-size: 14px; color: #16a34a; font-weight: 500; min-height: 20px; }
  </style>
</head>
<body>
  <h2>Song Card Generator</h2>
  <input id="query" placeholder="e.g. fromis_9 supersonic or track ID" autofocus />
  <button id="genBtn" onclick="generateCard()">Generate</button>
  <div class="status" id="statusMsg"></div>
  <textarea id="output" placeholder="Your ready-to-paste HTML will appear here..."></textarea>
  <script>
    // Trigger generateCard and copy on Enter
    document.getElementById('query').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        generateCard();
      }
    });

    async function generateCard() {
      const q = document.getElementById('query').value.trim();
      const statusMsg = document.getElementById('statusMsg');
      if (!q) return;

      const isId = /^\d+$/.test(q);
      const url = isId 
        ? `https://itunes.apple.com/lookup?id=${q}` 
        : `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=1`;

      try {
        statusMsg.textContent = 'Fetching...';
        const res = await fetch(url);
        const data = await res.json();
        const song = data.results[0];

        if (!song) {
          statusMsg.textContent = '';
          alert('No song found!');
          return;
        }

        const highResArt = song.artworkUrl100.replace('100x100bb', '600x600bb');

        // Clean 2-space indented block for pasting directly inside containers in VS Code
        const snippet = 
`<button class="song-card" data-preview="${song.previewUrl}">
  <img src="${highResArt}" alt="album art" class="song-cover">
  <div class="song-info">
    <span class="song-title">${song.trackName}</span>
    <span class="song-artist">${song.artistName}</span>
  </div>
  <span class="play-indicator">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </span>
</button>`;

        const textarea = document.getElementById('output');
        textarea.value = snippet;
        textarea.select();

        // Copy to clipboard
        await navigator.clipboard.writeText(snippet);
        statusMsg.textContent = '✓ Generated and copied to clipboard!';
        setTimeout(() => { statusMsg.textContent = ''; }, 3000);
      } catch (err) {
        statusMsg.textContent = '';
        alert('Fetch failed. You can run this file via Live Server to avoid local file restrictions.');
      }
    }
  </script>
</body>
</html>
